version: 2
updates:
  # oxc-parser is pinned to patch releases on purpose: its AST shape moves
  # between minors, and the adapter in src/extract/ast.ts should be updated
  # deliberately with the corpus check green, not by a floating range.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major bumps of the toolchain are deliberate upgrades, not PRs to
      # merge on green: the first grouped PR tried TypeScript 5 -> 7 and
      # vitest 3 -> 4 at once and did not build.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: vite-node
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
